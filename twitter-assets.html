<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>SAIDAN — Twitter Assets Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  *{ margin:0;padding:0;box-sizing:border-box; }
  body{ background:#0c0a14;color:#f0e8ff;font-family:'Noto Sans JP',sans-serif;padding:40px 24px 80px; }
  h1{ font-size:22px;font-weight:900;background:linear-gradient(135deg,#e879f9,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px; }
  .subtitle{ font-size:13px;color:#6b7280;margin-bottom:48px; }
  .asset{ margin-bottom:56px; }
  .label{ font-size:13px;font-weight:700;color:#c084fc;margin-bottom:10px; }
  .hint{ font-size:11px;color:#4b5563;margin-top:8px;line-height:1.7; }
  canvas{ display:block;max-width:100%;border-radius:12px;border:1px solid rgba(232,121,249,0.15); }
  .btns{ display:flex;gap:10px;margin-top:12px;flex-wrap:wrap; }
  button{ padding:9px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,#e879f9,#818cf8);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:opacity .15s; }
  button:hover{ opacity:.85; }
  .badge{ display:inline-block;font-size:10px;background:rgba(232,121,249,0.15);color:#e879f9;border:1px solid rgba(232,121,249,0.3);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle; }
</style>
</head>
<body>

<h1>⛩ SAIDAN Twitter Assets</h1>
<div class="subtitle">各画像を右クリック→「名前を付けて画像を保存」、またはダウンロードボタンで保存してください</div>

<div class="asset">
  <div class="label">📷 プロフィールアイコン <span class="badge">400 × 400 px</span></div>
  <canvas id="icon" width="400" height="400"></canvas>
  <div class="btns"><button onclick="dl('icon','saidan-icon.png')">⬇️ icon ダウンロード</button></div>
  <div class="hint">※ Twitterは円形にトリミングされます。</div>
</div>

<div class="asset">
  <div class="label">🖼 ヘッダー画像 <span class="badge">1500 × 500 px</span></div>
  <canvas id="header" width="1500" height="500"></canvas>
  <div class="btns"><button onclick="dl('header','saidan-header.png')">⬇️ header ダウンロード</button></div>
  <div class="hint">※ モバイルでは両端がクリップされます。中央に重要な要素を配置しています。</div>
</div>

<script>
// ── Utilities ────────────────────────────────────────────────

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function star5(ctx, x, y, r, color, alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i*Math.PI/5)-Math.PI/2, rad=i%2===0?r:r*0.42;
    i===0?ctx.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad):ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function sparkle4(ctx, x, y, size, color, alpha){
  ctx.save(); ctx.globalAlpha = alpha||1;
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  // Long arms (vertical+horizontal)
  ctx.lineWidth = size * 0.13;
  [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx*size, y+dy*size); ctx.stroke();
  });
  // Short diagonal arms
  ctx.lineWidth = size * 0.08;
  const d = size * 0.55;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx*d, y+dy*d); ctx.stroke();
  });
  ctx.restore();
}

// ── Core torii drawing function ──────────────────────────────
//
// Draws a proper torii gate (明神鳥居 style):
//   笠木 (kasagi) — top bar with upswept ends
//   島木 (shimagi) — straight bar just below kasagi
//   貫  (nuki)    — crossbeam through pillars
//   柱  (hashira) — pillars
//   亀腹 (kamebara) — pillar bases
//
// cx, cy = center of torii (at base of nuki roughly)
// s = scale (1.0 ≈ 300px wide)
// Colors: kasagiColor, nukiColor, pillarColor

function drawTorii(ctx, cx, cy, s, kasagiColor, nukiColor, pillarColor, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha != null ? alpha : 1;

  // ── Measurements (canonical, s=1) ──
  const pSpan  = 100 * s;   // pillar center ±x from axis
  const pW     = 26  * s;   // pillar width
  const pTop   = -62 * s;   // pillar top y (just below shimagi)
  const pBot   = 158 * s;   // pillar bottom y

  // ── 柱 (pillars) — slightly tapered ──
  ctx.fillStyle = pillarColor;
  for(const px of [-pSpan, pSpan]){
    ctx.beginPath();
    ctx.moveTo(px - pW*0.42, pTop);
    ctx.lineTo(px + pW*0.42, pTop);
    ctx.lineTo(px + pW*0.5,  pBot);
    ctx.lineTo(px - pW*0.5,  pBot);
    ctx.closePath();
    ctx.fill();
  }

  // ── 亀腹 (kamebara — base stones) ──
  ctx.fillStyle = pillarColor;
  for(const px of [-pSpan, pSpan]){
    ctx.beginPath();
    ctx.ellipse(px, pBot + 7*s, pW*0.5 + 10*s, 9*s, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // ── 貫 (nuki — crossbeam) ──
  ctx.fillStyle = nukiColor;
  const nkHalfW = pSpan + pW*0.5 + 15*s;
  const nkY     = 20 * s;
  const nkH     = 17 * s;
  ctx.beginPath();
  roundRect(ctx, -nkHalfW, nkY, nkHalfW*2, nkH, 4*s);
  ctx.fill();

  // ── 島木 (shimagi — bar just below kasagi) ──
  ctx.fillStyle = nukiColor;
  const smHalfW = pSpan + pW*0.5 + 4*s;
  const smY     = -80 * s;
  const smH     = 20 * s;
  ctx.beginPath();
  roundRect(ctx, -smHalfW, smY, smHalfW*2, smH, 4*s);
  ctx.fill();

  // ── 笠木 (kasagi — top curved bar with upswept ends) ──
  //
  // The kasagi shape:
  //   - Flat bottom edge
  //   - Ends sweep upward (反り) past the pillar line
  //   - Top surface gently dips in the center, rises to tips
  //
  ctx.fillStyle = kasagiColor;

  const kHW   = pSpan + pW*0.5 + 45*s;  // half-width of straight portion
  const kTipX = kHW + 16*s;             // x of tip
  const kBot  = -80 * s;                // bottom y (flush with shimagi top)
  const kTipY = -152 * s;               // y of upswept tip
  const kMidY = -116 * s;               // y of top surface at center (flat middle)

  ctx.beginPath();
  // Bottom edge (straight left → right)
  ctx.moveTo(-kHW, kBot);
  ctx.lineTo( kHW, kBot);

  // Right end: sweep upward (反り)
  ctx.bezierCurveTo(
    kHW + 14*s,  kBot,          // ctrl1: pull right
    kTipX + 8*s, kMidY + 10*s, // ctrl2: sweeping up
    kTipX,       kTipY          // tip
  );

  // Top edge right half: from tip back toward center
  ctx.bezierCurveTo(
    kTipX - 12*s, kTipY - 6*s,  // ctrl1: slightly inside tip
    kHW * 0.55,   kMidY - 8*s,  // ctrl2: curving inward
    0,            kMidY          // center (slight dip)
  );

  // Top edge left half: from center to left tip
  ctx.bezierCurveTo(
    -kHW * 0.55,   kMidY - 8*s,
    -(kTipX-12*s), kTipY - 6*s,
    -kTipX,        kTipY
  );

  // Left end: sweep back down
  ctx.bezierCurveTo(
    -(kTipX + 8*s), kMidY + 10*s,
    -(kHW + 14*s),  kBot,
    -kHW,           kBot
  );
  ctx.closePath();
  ctx.fill();

  // Subtle highlight on kasagi face
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath();
  ctx.moveTo(-kHW + 6*s, kBot - 3*s);
  ctx.lineTo( kHW - 6*s, kBot - 3*s);
  ctx.bezierCurveTo(kHW*0.5, kBot - 6*s, kHW*0.15, kMidY+18*s, 0, kMidY+20*s);
  ctx.bezierCurveTo(-kHW*0.15, kMidY+18*s, -kHW*0.5, kBot - 6*s, -kHW + 6*s, kBot - 3*s);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


// ── ICON (400 × 400) ─────────────────────────────────────────
function drawIcon(){
  const canvas = document.getElementById('icon');
  const ctx = canvas.getContext('2d');
  const W=400, H=400;

  // Dark background
  ctx.fillStyle='#0c0a14';
  ctx.fillRect(0,0,W,H);

  // Subtle center glow (very soft)
  const gl = ctx.createRadialGradient(200,200,0,200,200,180);
  gl.addColorStop(0,'rgba(255,255,255,0.05)');
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);

  // White torii — centered, large, clean silhouette
  drawTorii(ctx, 200, 210, 0.88, '#ffffff', '#ffffff', '#ffffff');
}


// ── HEADER (1500 × 500) ──────────────────────────────────────
function drawHeader(){
  const canvas = document.getElementById('header');
  const ctx = canvas.getContext('2d');
  const W=1500, H=500;

  // Background
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0c0a14'); bg.addColorStop(0.45,'#180d30');
  bg.addColorStop(0.75,'#130820'); bg.addColorStop(1,'#0c0a14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Glows
  [[750,250,480,0.14],[260,250,330,0.09],[1240,250,330,0.07]].forEach(([x,y,r,a])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(232,121,249,${a})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  });

  // Stars
  [
    [75,50,13,0.9],[130,420,9,0.65],[310,68,8,0.5],[415,445,11,0.75],
    [680,35,7,0.5],[820,455,8,0.55],[560,415,6,0.4],[940,30,7,0.5],
    [1085,60,12,0.85],[1195,415,9,0.6],[1365,85,11,0.75],[1445,440,13,0.9],
  ].forEach(([x,y,r,a])=> star5(ctx,x,y,r,'#fbbf24',a));

  // Sparkles
  [
    [260,72,17,'rgba(240,171,252,0.6)'],[1240,75,15,'rgba(165,180,252,0.55)'],
    [182,418,12,'rgba(240,171,252,0.42)'],[1318,415,12,'rgba(165,180,252,0.42)'],
    [408,145,10,'rgba(240,171,252,0.35)'],[1092,145,10,'rgba(165,180,252,0.35)'],
    [508,440,9,'rgba(240,171,252,0.28)'],[992,442,9,'rgba(165,180,252,0.28)'],
  ].forEach(([x,y,s,c])=> sparkle4(ctx,x,y,s,c));

  // ── Left torii ──
  drawTorii(ctx, 220, 310, 0.56, '#e879f9','#a855f7','#c084fc', 0.9);

  // ── Right torii (mirrored) ──
  ctx.save();
  ctx.scale(-1,1); ctx.translate(-W,0);
  drawTorii(ctx, 220, 310, 0.50, '#818cf8','#6366f1','#a5b4fc', 0.6);
  ctx.restore();

  // Decorative line above title
  const lineG=ctx.createLinearGradient(360,0,1140,0);
  lineG.addColorStop(0,'rgba(232,121,249,0)');
  lineG.addColorStop(0.3,'rgba(232,121,249,0.5)');
  lineG.addColorStop(0.7,'rgba(129,140,248,0.5)');
  lineG.addColorStop(1,'rgba(129,140,248,0)');
  ctx.strokeStyle=lineG; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(360,150); ctx.lineTo(1140,150); ctx.stroke();

  // ⛩ above title
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font='60px serif';
  ctx.fillText('⛩',750,185);

  // Main "SAIDAN" title
  ctx.shadowColor='rgba(232,121,249,0.6)'; ctx.shadowBlur=45;
  const tg=ctx.createLinearGradient(420,0,1080,0);
  tg.addColorStop(0,'#e879f9'); tg.addColorStop(0.55,'#d946ef'); tg.addColorStop(1,'#818cf8');
  ctx.fillStyle=tg;
  ctx.font="900 130px 'Arial Black','Noto Sans JP',Arial,sans-serif";
  ctx.fillText('SAIDAN',750,328);
  ctx.shadowBlur=0;

  // Subtitle
  ctx.fillStyle='#9ca3af';
  ctx.font="700 26px 'Noto Sans JP',sans-serif";
  ctx.fillText('推しグッズ祭壇メーカー',750,374);

  // Decorative line below
  ctx.strokeStyle=lineG; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(360,394); ctx.lineTo(1140,394); ctx.stroke();

  // URL
  ctx.fillStyle='#374151';
  ctx.font="400 16px 'Noto Sans JP',Arial,sans-serif";
  ctx.fillText('saidan-black.vercel.app',750,430);

  // Center dots
  [700,722,744,766,788].forEach((x,i)=>{
    ctx.fillStyle=i===2?'#e879f9':'rgba(232,121,249,0.28)';
    ctx.beginPath(); ctx.arc(x,456,i===2?5:3,0,Math.PI*2); ctx.fill();
  });
}


// ── Run ──────────────────────────────────────────────────────
document.fonts.ready.then(()=>{ drawIcon(); drawHeader(); });

function dl(id,filename){
  const a=document.createElement('a');
  a.download=filename;
  a.href=document.getElementById(id).toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
